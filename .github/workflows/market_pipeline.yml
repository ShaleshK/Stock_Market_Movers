name: Market Movers Automated Report Pipeline

on:
  # 1. Automated Schedule: Wakes up Monday-Friday at 1:00 PM UTC (8:00 AM Chicago Time)
  schedule:
    - cron: '0 13 * * 1-5'
    
  # 2. Manual Trigger: Allows you to click a button on GitHub to test run it anytime
  workflow_dispatch:

jobs:
  run-analytics-pipeline:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download your source code files into the cloud container
    - name: Checkout Repository Source Code
      uses: actions/checkout@v4

    # Step 2: Provision a modern, stable Python environment
    - name: Set up Python 3.11 Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Automatically caches packages to speed up subsequent runs

    # Step 3: Hydrate all data science and networking libraries
    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Step 4: Inject GitHub Secrets safely into the environment and execute code
    - name: Execute Main Production Orchestrator
      env:
        EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        GCS_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GCS_SERVICE_ACCOUNT_KEY_JSON }}
      # Step 4: Inject
      GitHub
      Secrets safely and declare system paths
    - name: Execute Main Production Orchestrator
      env:
        EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        GCS_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GCS_SERVICE_ACCOUNT_KEY_JSON }}
        PYTHONPATH: ${{ github.workspace }}  # Tells the cloud server exactly where your src/ folder lives
      run: |
        python main.py
