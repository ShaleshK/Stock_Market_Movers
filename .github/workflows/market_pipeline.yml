name: Market Movers Automated Report Pipeline

on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

jobs:
  run-analytics-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11 Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Section 4: Secure Key Mapping (Cleaned of all backslash characters)
    - name: Execute Main Production Orchestrator
      env:
        EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        GCS_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GCS_SERVICE_ACCOUNT_KEY_JSON }}
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python main.py

